<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Metriotes: define tu Norte, crea hábitos y encuentra profesionales de bienestar. Versión web de la app.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://metriotes.com/">
  <meta name="theme-color" content="#5B7A94">
  <meta property="og:site_name" content="Metriotes">
  <meta property="og:title" content="Metriotes · La persona que quieres ser.">
  <meta property="og:image" content="https://metriotes.com/assets/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Metriotes">
  <link rel="apple-touch-icon" href="icons/Metriotes.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Metriotes.png"/>

  <title>Metriotes · Web app</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="454333235960-qpai8rp5v3k0omp482jf7f668i8uvo03.apps.googleusercontent.com">
</head>
<body>
  <!-- Contenido para rastreadores y navegadores sin JS. La app de Flutter dibuja en un
       canvas, así que Google no puede leerla: las páginas indexables (directorio, perfiles,
       eventos, blog) son HTML estático generado por metriotes_website/tools/seo/build.py. -->
  <noscript>
    <h1>Metriotes, la persona que quieres ser</h1>
    <p>Objetivos, hábitos y profesionales de bienestar en una sola app.</p>
    <nav>
      <a href="https://metriotes.com/">Inicio</a>
      <a href="https://metriotes.com/profesionales/">Directorio de profesionales</a>
      <a href="https://metriotes.com/eventos/">Eventos y clases</a>
      <a href="https://metriotes.com/blog/">Blog</a>
    </nav>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Register sqflite service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sqflite_sw.js');
      });
    }
  </script>
</body>
</html>
