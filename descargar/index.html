<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Descarga Metriotes</title>
<!--
  Enlace único para promociones: metriotes.com/descargar
  iPhone/iPad -> App Store, Android -> Google Play, ordenador -> esta página con los dos botones.
  Los parámetros utm_* del enlace se pasan a Google Play como "referrer" para saber de qué campaña viene la instalación.
  No sustituye a /app (versión web) ni a la landing.
-->
<script>
(function () {
  var APP_STORE = "https://apple.co/3LX7yom";
  var PLAY = "https://play.google.com/store/apps/details?id=com.metriotes.metriotes_front";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) {
    location.replace(APP_STORE);
  } else if (isAndroid) {
    var utm = [];
    new URLSearchParams(location.search).forEach(function (v, k) {
      if (k.indexOf("utm_") === 0) utm.push(k + "=" + v);
    });
    location.replace(utm.length ? PLAY + "&referrer=" + encodeURIComponent(utm.join("&")) : PLAY);
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#EFEDE8; --card:#F9F7F3; --ink:#1E1C1A; --muted:#6B655F; --accent:#EE5347; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:"Poppins", system-ui, sans-serif; padding:24px 16px; }
  main { background:var(--card); border-radius:24px; padding:40px 32px; max-width:440px; width:100%; text-align:center;
         box-shadow:-8px 12px 32px -16px rgba(90,60,40,.3); }
  img.logo { width:56px; height:56px; border-radius:14px; }
  h1 { font-family:"Kalnia", Georgia, serif; font-weight:500; font-size:30px; margin:16px 0 8px; }
  p { color:var(--muted); margin:0 0 24px; line-height:1.6; }
  .badges { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; }
  .badges img { height:48px; width:auto; }
  .badges .gplay img { height:70px; margin:-11px 0; }
  a.web { display:inline-block; margin-top:20px; color:var(--accent); font-weight:500; text-decoration:none; }
  a.web:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/logo.png" alt="Metriotes">
  <h1 data-i18n="title">Descarga Metriotes</h1>
  <p data-i18n="sub">Todo empieza por tu Norte. Descárgala gratis en tu móvil.</p>
  <div class="badges">
    <a href="https://apple.co/3LX7yom"><img id="as-badge" src="/assets/download_app_store_es.svg" alt="Descargar en App Store"></a>
    <a class="gplay" href="https://play.google.com/store/apps/details?id=com.metriotes.metriotes_front"><img id="gp-badge" src="https://play.google.com/intl/es/badges/static/images/badges/es_badge_web_generic.png" alt="Disponible en Google Play"></a>
  </div>
  <a class="web" href="/app/" data-i18n="web">O entra desde la web</a>
</main>
<script>
  var translations = {
    es: { title: "Descarga Metriotes", sub: "Todo empieza por tu Norte. Descárgala gratis en tu móvil.", web: "O entra desde la web" },
    en: { title: "Download Metriotes", sub: "Everything starts with your North. Download it for free on your phone.", web: "Or use it on the web" }
  };
  var lang = "es";
  try { lang = localStorage.getItem("preferredLang") || ((navigator.language || "es").toLowerCase().indexOf("es") === 0 ? "es" : "en"); } catch (e) {}
  if (!translations[lang]) lang = "es";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = translations[lang][el.getAttribute("data-i18n")]; });
  if (lang === "en") {
    document.getElementById("gp-badge").src = "https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png";
    document.getElementById("gp-badge").alt = "Get it on Google Play";
    document.getElementById("as-badge").src = "/assets/download_app_store_en.svg";
    document.getElementById("as-badge").alt = "Download on the App Store";
  }
</script>
</body>
</html>
