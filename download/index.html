<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Metriotes</title>
    <meta name="description" content="Descarga la app de Metriotes en el App Store o en Google Play.">
    <meta name="theme-color" content="#5B7A94">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://www.metriotes.com/download/">
    <link rel="icon" href="/app/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Metriotes">
    <meta property="og:title" content="Descarga Metriotes · La persona que quieres ser.">
    <meta property="og:description" content="Descarga la app de Metriotes en el App Store o en Google Play.">
    <meta property="og:url" content="https://www.metriotes.com/download/">
    <meta property="og:image" content="https://metriotes.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Redirige al store según el dispositivo antes de pintar nada.
         iPadOS 13+ se presenta como "Macintosh", por eso se mira maxTouchPoints. -->
    <script>
        (function() {
            var APP_STORE = 'https://apple.co/3LX7yom';
            var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.metriotes.metriotes_front';
            var ua = navigator.userAgent || '';
            var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            if (isIOS) window.location.replace(APP_STORE);
            else if (/Android/i.test(ua)) window.location.replace(PLAY_STORE);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --terra: #5B7A94;
            --amber: #8FA8B8;
            --surface: #FFFFFF;
            --text-primary: #0F1620;
            --text-secondary: #4A5C6E;
            --text-muted: #8A9AAB;
            --border: rgba(91,122,148,0.16);
            --shadow-card: 0 1px 3px rgba(15,22,32,0.05), 0 8px 24px rgba(15,22,32,0.09);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(180deg, #EEF3F8 0%, #E4EDF3 50%, #DEE8F0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: clamp(2.5rem, 8vw, 5rem) clamp(1.25rem, 4vw, 2rem);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            font-family: 'Kalnia', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 2.5rem;
        }
        .logo img { width: 22px; height: 28px; }

        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: clamp(1.75rem, 5vw, 2.75rem);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            text-align: center;
        }
        .eyebrow {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--terra);
            margin-bottom: 0.75rem;
        }
        h1 {
            font-family: 'Kalnia', Georgia, serif;
            font-size: clamp(1.75rem, 4.5vw, 2.375rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.15;
            margin-bottom: 0.75rem;
        }
        p.lead {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.65;
            margin-bottom: 1.75rem;
        }
        .stores {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }
        .stores img {
            height: 46px;
            width: auto;
            transition: transform 200ms var(--ease-spring);
        }
        /* El PNG de Google trae margen transparente: se agranda para igualar al de Apple. */
        #play-store-badge { height: 68px; margin: -11px 0; }
        .stores a:hover img { transform: scale(1.03); }
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .footer a { color: var(--terra); font-weight: 500; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="logo">
            <img src="/app/Metriotes.png" alt="Metriotes">
            Metriotes
        </a>

        <!-- Se ve en escritorio, o si la redirección no ocurrió. -->
        <div class="card">
            <div class="eyebrow" data-i18n="eyebrow">Descarga la app</div>
            <h1 data-i18n="title">Lleva Metriotes contigo</h1>
            <p class="lead" data-i18n="lead">Elige tu tienda para descargar Metriotes en tu móvil.</p>
            <div class="stores">
                <a href="https://apple.co/3LX7yom" rel="noopener" aria-label="App Store">
                    <img id="app-store-badge" src="/assets/download_app_store_es.svg" alt="Descargar en el App Store">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.metriotes.metriotes_front" rel="noopener" aria-label="Google Play">
                    <img id="play-store-badge" src="https://play.google.com/intl/es/badges/static/images/badges/es_badge_web_generic.png" alt="Disponible en Google Play" onerror="this.replaceWith(document.createTextNode('Google Play'))">
                </a>
            </div>
        </div>

        <div class="footer">
            <a href="/">metriotes.com</a>
        </div>
    </div>

    <script>
        (function() {
            var translations = {
                es: {
                    eyebrow: 'Descarga la app',
                    title: 'Lleva Metriotes contigo',
                    lead: 'Elige tu tienda para descargar Metriotes en tu móvil.'
                },
                en: {
                    eyebrow: 'Get the app',
                    title: 'Take Metriotes with you',
                    lead: 'Choose your store to download Metriotes on your phone.'
                }
            };

            function setLanguage(lang) {
                var t = translations[lang] || translations.es;
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var key = el.getAttribute('data-i18n');
                    if (t[key]) el.textContent = t[key];
                });
                document.getElementById('app-store-badge').src = '/assets/download_app_store_' + lang + '.svg';
                var play = document.getElementById('play-store-badge');
                if (play) play.src = lang === 'es'
                    ? 'https://play.google.com/intl/es/badges/static/images/badges/es_badge_web_generic.png'
                    : 'https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png';
                if (play) play.alt = lang === 'es' ? 'Disponible en Google Play' : 'Get it on Google Play';
            }

            var lang = null;
            try { lang = localStorage.getItem('preferredLang'); } catch (e) {}
            if (!lang) lang = (navigator.language || 'es').slice(0, 2);
            setLanguage(lang === 'en' ? 'en' : 'es');
        })();
    </script>
</body>
</html>
